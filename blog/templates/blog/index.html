<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>
    <h1>Blog</h1>

    {% for post in posts %}
        <hr/>
        <h2><a href="{{ p.get_absolute_url }}"> {{p.title}} </a></h2>
        <h4>{{post.create_at}}</h4>
        <p>{{post.content}}</p>
    {% endfor %}
</body>
</html>
